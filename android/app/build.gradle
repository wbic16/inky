plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'io.phext.inky'
    compileSdk 34
    defaultConfig {
        applicationId 'io.phext.inky'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        python {
            version '3.12'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
}
